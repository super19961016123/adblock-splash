#
# Title: 开屏广告屏蔽规则 (Splash Screen Ads Block)
# Description: 屏蔽全网主流开屏广告 SDK 域名，覆盖国内（穿山甲、优量汇/广点通、百度联盟、
#              快手联盟、阿里/友盟、有米、多盟、AdView、万普等）及海外（AdMob、AdSense、
#              DoubleClick、AppLovin、ironSource、Unity Ads、Mintegral、Vungle、
#              AdColony、InMobi、Tapjoy 等）主流开屏/插屏/信息流广告平台。
# Format: QuantumultX 规则（host-suffix,域名,reject），亦兼容 Loon 同格式。
# 用法：QuantumultX -> 配置 -> [filter_local] 中引用本文件，或作为过滤器资源引用。
#       建议配合 adblockqxlite.conf / adblockqx.conf 全量规则一起使用效果最佳。
# 说明：域名拦截只能拦掉走独立广告域名的开屏广告；若 App 将广告与内容同域名下发
#       （如部分头条系/腾讯系应用），需要额外的 rewrite 规则才能彻底去除。
#
