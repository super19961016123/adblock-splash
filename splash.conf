#
# ===================== 补充说明 =====================
# 1. 以上规则按「广告 SDK 根域名」屏蔽，host-suffix 会匹配该域名及其所有子域名。
# 2. 若某些 App 开屏广告仍出现，多为广告与业务同域名下发，需额外使用 rewrite 规则
#    或抓包定位具体广告接口后加入。可参考：
#    https://raw.githubusercontent.com/fmz200/wool_scripts/main/QuantumultX/rewrite/rewrite.snippet
# 3. 建议与 217heidai/adblockfilters 的全量规则（adblockqx.conf / adblockqxlite.conf）叠加使用，
#    以覆盖非开屏类的弹窗、横幅、视频广告。
# 4. 规则长期有效但广告域名会不断更换，建议定期更新或引入自动更新订阅。
