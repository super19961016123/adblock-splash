#
# Title: 微信广告屏蔽规则 (WeChat Ads Block)
# Format: QuantumultX 规则（host-suffix,域名,reject-200 / rewrite_local），亦兼容 Loon 同格式。
# 用法：QuantumultX -> 配置 -> [filter_local] / [rewrite_local] 引用，或作为过滤器资源 + 重写资源引用。
#
# ⚠️ 重要说明（务必先读）：
# 微信与普通 App 不同——广告与正常聊天/公众号内容共用域名与 CDN（图片均走 mmbiz.qpic.cn 等）。
# 因此无法靠"屏蔽整个域名"来去广告（会连正常内容一起拦掉）。本规则采用：
#   ① 公众号文章广告：直接处理广告接口，返回空广告（最有效）
#   ② 朋友圈 / 小程序广告：屏蔽腾讯广告专用接口 + 推荐微信官方关闭入口
# 效果与局限见各段注释。请勿把 mmbiz.qpic.cn / mmbiz.qlogo.cn 等正常内容 CDN 加入屏蔽。
#

# ===================== 一、公众号文章广告（最有效，推荐开启） =====================
# 公众号文章底部/文中的广告，由 mp.weixin.qq.com/mp/getappmsgad 接口下发。
# 做法：返回空广告（HTTP 200 空响应），公众号文章正常显示、广告位消失。
[rewrite_local]
# 公众号文章广告接口 -> 返回空广告，广告不展示
^https?:\/\/mp\.weixin\.qq\.com\/mp\/getappmsgad url reject-200
# 公众号其他广告下发接口 -> 拒绝
^https?:\/\/mp\.weixin\.qq\.com\/mp\/(ad_|advertisement) url reject-200

# ===================== 二、朋友圈广告（效果有限，需配合微信官方设置） =====================
# 朋友圈广告由微信客户端内嵌下发，与正常信息流同源，无法用域名拦截。
# 有效手段：微信自带关闭入口（见文末），此段仅屏蔽腾讯广告监测类接口，减少广告个性化推荐。
host-suffix,mp.weixin.qq.com,reject-200   # 注意：mp.weixin.qq.com 也承载公众号正文，不要整体屏蔽！
# 仅屏蔽腾讯广告投放/监测专用子域（不影响正常功能）
host-suffix,wxa.wxs.qq.com,reject-200
host-suffix,wximg.wxs.qq.com,reject-200
host-suffix,wxsmw.wxs.qq.com,reject-200

# ===================== 三、微信小程序广告（效果有限） =====================
# 小程序广告走微信广告平台域名，屏蔽以下广告专用域名（不误伤小程序功能）
host-suffix,wxads.qq.com,reject-200
host-suffix,advertise.wxs.qq.com,reject-200
host-suffix,ams.ad.xiaoyouxi.qq.com,reject-200

# ===================== 四、通用：腾讯广告监测（广告计费/追踪类，不误伤内容） =====================
host-suffix,adservice.weixinbridge.com,reject-200
host-suffix,weixinbridge.com,reject-200
host-suffix,adsmind.gdtimg.com,reject-200
host-suffix,gtimg.com,reject-200
host-suffix,sdk.e.qq.com,reject-200
host-suffix,e.qq.com,reject-200

# =========================================================
# 【效果与局限说明】
# ✅ 公众号文章广告：可基本去除（处理广告接口返回空广告）。
# ⚠️ 朋友圈广告：域名屏蔽只能减少"个性化推荐/追踪"，无法彻底消除；
#     请配合下方官方设置关闭个性化广告。
# ⚠️ 小程序广告：部分可拦，部分小程序广告与功能同源，无法彻底去除。
# ⚠️ 请勿屏蔽 mmbiz.qpic.cn / mmbiz.qlogo.cn（微信图片 CDN），否则图片不显示。
#
# 【强烈建议同时开启的微信官方设置（可减少 90% 广告）】
# 微信 -> 我 -> 设置 -> 个人信息与权限 -> 个性化广告管理 -> 广告信息管理
#   -> 把全部兴趣标签关闭 -> 完成。
# 设置后微信不再基于你的兴趣推送广告，广告数量大幅减少。
#
# 【如需更彻底（仅 Android / iOS 越狱用户）】
# 可用客户端 Hook 模块（如 LSPosed 的"微X模块"/去广告模块）彻底去除朋友圈广告。
# 此类方案不在网络规则范围内，需自行在手机端操作。
# =========================================================
